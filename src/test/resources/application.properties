# Configuração para testes - usar H2 em memória
app.database.type=h2

# Configuração do banco H2 em memória
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop

# Configuração JWT para testes
app.jwt.secret=testSecretKeyForJWTTokenGenerationInTestEnvironment123456789
app.jwt.expiration=86400000

# Configuração de logging para testes
logging.level.com.example.betaware=DEBUG
logging.level.org.springframework.security=DEBUG