name: Security Pipeline (SAST, DAST, SCA)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      security_scan_type:
        description: 'Type of security scan'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - sast-only
          - dast-only
          - sca-only

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx3072m'
  SECURITY_POLICIES_FILE: 'security-policies.yml'

jobs:
  sast-analysis:
    name: SAST - Static Application Security Testing
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache SonarQube packages
      uses: actions/cache@v3
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    
    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Run SAST with SonarQube
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn clean verify sonar:sonar \
          -Dsonar.projectKey=betaware-api \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=betaware \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
    
    - name: Semgrep SAST Scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
          p/java
        generateSarif: "1"
    
    - name: Upload Semgrep results to GitHub
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: semgrep.sarif
    
    - name: Security Gate Check
      run: |
        echo "Checking for critical security vulnerabilities..."
        if [ -f semgrep.sarif ]; then
          CRITICAL_COUNT=$(jq '.runs[0].results | map(select(.level == "error")) | length' semgrep.sarif)
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ SECURITY GATE FAILED: $CRITICAL_COUNT critical vulnerabilities found"
            exit 1
          else
            echo "✅ SECURITY GATE PASSED: No critical vulnerabilities found"
          fi
        fi

  sca-analysis:
    name: SCA - Software Composition Analysis
    runs-on: ubuntu-latest
    needs: sast-analysis
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Run OWASP Dependency Check
      run: |
        mvn org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=7 \
          -DsuppressionsLocation=dependency-check-suppressions.xml
    
    - name: Run Snyk Security Scan
      uses: snyk/actions/maven@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --fail-on=upgradable
    
    - name: Upload dependency check results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: dependency-check-report
        path: target/dependency-check-report.html

  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    needs: [sast-analysis, sca-analysis]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Run tests with coverage
      run: |
        mvn clean test jacoco:report
    
    - name: Build application
      run: |
        mvn clean package -DskipTests
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: jar-artifact
        path: target/*.jar

  dast-analysis:
    name: DAST - Dynamic Application Security Testing
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: jar-artifact
        path: target/
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Start application for DAST
      run: |
        java -jar target/*.jar &
        sleep 30
        curl -f http://localhost:8080/v1/health || exit 1
      env:
        SPRING_PROFILES_ACTIVE: test
    
    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: 'http://localhost:8080'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
    
    - name: Run OWASP ZAP Full Scan
      uses: zaproxy/action-full-scan@v0.8.0
      with:
        target: 'http://localhost:8080'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
    
    - name: Upload ZAP results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: zap-reports
        path: report_*

  security-gate-check:
    name: Security Gate Validation
    runs-on: ubuntu-latest
    needs: [sast-analysis, sca-analysis]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download SAST results
      uses: actions/download-artifact@v3
      with:
        name: sast-reports
        path: ./sast-results
      continue-on-error: true
    
    - name: Download SCA results
      uses: actions/download-artifact@v3
      with:
        name: sca-reports
        path: ./sca-results
      continue-on-error: true
    
    - name: Load security policies
      id: load-policies
      run: |
        if [ -f "${{ env.SECURITY_POLICIES_FILE }}" ]; then
          echo "Security policies file found"
          # Extract thresholds from YAML (simplified)
          CRITICAL_THRESHOLD=$(grep -A 10 "vulnerability_thresholds:" ${{ env.SECURITY_POLICIES_FILE }} | grep "critical:" | awk '{print $2}')
          HIGH_THRESHOLD=$(grep -A 10 "vulnerability_thresholds:" ${{ env.SECURITY_POLICIES_FILE }} | grep "high:" | awk '{print $2}')
          MEDIUM_THRESHOLD=$(grep -A 10 "vulnerability_thresholds:" ${{ env.SECURITY_POLICIES_FILE }} | grep "medium:" | awk '{print $2}')
          
          echo "critical_threshold=${CRITICAL_THRESHOLD:-0}" >> $GITHUB_OUTPUT
          echo "high_threshold=${HIGH_THRESHOLD:-5}" >> $GITHUB_OUTPUT
          echo "medium_threshold=${MEDIUM_THRESHOLD:-10}" >> $GITHUB_OUTPUT
        else
          echo "Using default thresholds"
          echo "critical_threshold=0" >> $GITHUB_OUTPUT
          echo "high_threshold=5" >> $GITHUB_OUTPUT
          echo "medium_threshold=10" >> $GITHUB_OUTPUT
        fi
    
    - name: Evaluate security gate
      id: security-gate
      run: |
        GATE_STATUS="PASS"
        VIOLATIONS=""
        
        # Check SCA results
        if [ -f "sca-results/dependency-check-report.json" ]; then
          CRITICAL_VULNS=$(jq '.dependencies[].vulnerabilities[]? | select(.severity == "CRITICAL") | .severity' sca-results/dependency-check-report.json 2>/dev/null | wc -l || echo "0")
          HIGH_VULNS=$(jq '.dependencies[].vulnerabilities[]? | select(.severity == "HIGH") | .severity' sca-results/dependency-check-report.json 2>/dev/null | wc -l || echo "0")
          MEDIUM_VULNS=$(jq '.dependencies[].vulnerabilities[]? | select(.severity == "MEDIUM") | .severity' sca-results/dependency-check-report.json 2>/dev/null | wc -l || echo "0")
          
          echo "Found vulnerabilities - Critical: $CRITICAL_VULNS, High: $HIGH_VULNS, Medium: $MEDIUM_VULNS"
          
          if [ "$CRITICAL_VULNS" -gt "${{ steps.load-policies.outputs.critical_threshold }}" ]; then
            GATE_STATUS="FAIL"
            VIOLATIONS="$VIOLATIONS Critical vulnerabilities: $CRITICAL_VULNS (threshold: ${{ steps.load-policies.outputs.critical_threshold }});"
          fi
          
          if [ "$HIGH_VULNS" -gt "${{ steps.load-policies.outputs.high_threshold }}" ]; then
            GATE_STATUS="FAIL"
            VIOLATIONS="$VIOLATIONS High vulnerabilities: $HIGH_VULNS (threshold: ${{ steps.load-policies.outputs.high_threshold }});"
          fi
          
          if [ "$MEDIUM_VULNS" -gt "${{ steps.load-policies.outputs.medium_threshold }}" ]; then
            if [ "$GATE_STATUS" != "FAIL" ]; then
              GATE_STATUS="WARN"
            fi
            VIOLATIONS="$VIOLATIONS Medium vulnerabilities: $MEDIUM_VULNS (threshold: ${{ steps.load-policies.outputs.medium_threshold }});"
          fi
        fi
        
        echo "status=$GATE_STATUS" >> $GITHUB_OUTPUT
        echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
        
        if [ "$GATE_STATUS" = "FAIL" ]; then
          echo "🚨 Security Gate FAILED"
          echo "Violations: $VIOLATIONS"
          exit 1
        elif [ "$GATE_STATUS" = "WARN" ]; then
          echo "⚠️ Security Gate WARNING"
          echo "Violations: $VIOLATIONS"
        else
          echo "✅ Security Gate PASSED"
        fi
    
    - name: Create security gate summary
      run: |
        mkdir -p security-gate
        cat > security-gate/summary.json << EOF
        {
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "gate_status": "${{ steps.security-gate.outputs.status }}",
          "violations": "${{ steps.security-gate.outputs.violations }}",
          "thresholds": {
            "critical": ${{ steps.load-policies.outputs.critical_threshold }},
            "high": ${{ steps.load-policies.outputs.high_threshold }},
            "medium": ${{ steps.load-policies.outputs.medium_threshold }}
          },
          "workflow_run": "${{ github.run_id }}",
          "commit_sha": "${{ github.sha }}"
        }
        EOF
    
    - name: Upload security gate results
      uses: actions/upload-artifact@v3
      with:
  # Consolidated Security Report
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [sast-analysis, sca-analysis, dast-analysis, security-gate-check]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all security reports
      uses: actions/download-artifact@v3
      with:
        path: ./security-reports
    
    - name: Generate consolidated report
      run: |
        mkdir -p consolidated-report
        
        echo "# BetAware API Security Report" > consolidated-report/security-report.md
        echo "Generated on: $(date)" >> consolidated-report/security-report.md
        echo "Workflow Run: ${{ github.run_id }}" >> consolidated-report/security-report.md
        echo "Commit: ${{ github.sha }}" >> consolidated-report/security-report.md
        echo "" >> consolidated-report/security-report.md
        
        # Security Gate Status
        echo "## 🛡️ Security Gate Status" >> consolidated-report/security-report.md
        if [ -f "security-reports/security-gate-results/summary.json" ]; then
          GATE_STATUS=$(jq -r '.gate_status' security-reports/security-gate-results/summary.json)
          VIOLATIONS=$(jq -r '.violations' security-reports/security-gate-results/summary.json)
          
          if [ "$GATE_STATUS" = "PASS" ]; then
            echo "✅ **PASSED** - All security thresholds met" >> consolidated-report/security-report.md
          elif [ "$GATE_STATUS" = "WARN" ]; then
            echo "⚠️ **WARNING** - Some thresholds exceeded" >> consolidated-report/security-report.md
            echo "- Violations: $VIOLATIONS" >> consolidated-report/security-report.md
          else
            echo "🚨 **FAILED** - Critical security thresholds exceeded" >> consolidated-report/security-report.md
            echo "- Violations: $VIOLATIONS" >> consolidated-report/security-report.md
          fi
        else
          echo "❓ Security gate status unavailable" >> consolidated-report/security-report.md
        fi
        echo "" >> consolidated-report/security-report.md
        
        echo "## 🔍 SAST Analysis Results" >> consolidated-report/security-report.md
        if [ -d "security-reports/sast-reports" ]; then
          echo "✅ SAST analysis completed" >> consolidated-report/security-report.md
          if [ -f "security-reports/sast-reports/sonarqube-report.json" ]; then
            echo "- SonarQube analysis available" >> consolidated-report/security-report.md
          fi
          if [ -f "security-reports/sast-reports/spotbugs-report.xml" ]; then
            echo "- SpotBugs analysis available" >> consolidated-report/security-report.md
          fi
          if [ -f "security-reports/sast-reports/semgrep-report.json" ]; then
            echo "- Semgrep security scan available" >> consolidated-report/security-report.md
          fi
        else
          echo "❌ SAST analysis failed or not available" >> consolidated-report/security-report.md
        fi
        echo "" >> consolidated-report/security-report.md
        
        echo "## 📦 SCA Analysis Results" >> consolidated-report/security-report.md
        if [ -d "security-reports/sca-reports" ]; then
          echo "✅ SCA analysis completed" >> consolidated-report/security-report.md
          if [ -f "security-reports/sca-reports/dependency-check-report.json" ]; then
            CRITICAL=$(jq '.dependencies[].vulnerabilities[]? | select(.severity == "CRITICAL") | .severity' security-reports/sca-reports/dependency-check-report.json 2>/dev/null | wc -l || echo "0")
            HIGH=$(jq '.dependencies[].vulnerabilities[]? | select(.severity == "HIGH") | .severity' security-reports/sca-reports/dependency-check-report.json 2>/dev/null | wc -l || echo "0")
            MEDIUM=$(jq '.dependencies[].vulnerabilities[]? | select(.severity == "MEDIUM") | .severity' security-reports/sca-reports/dependency-check-report.json 2>/dev/null | wc -l || echo "0")
            LOW=$(jq '.dependencies[].vulnerabilities[]? | select(.severity == "LOW") | .severity' security-reports/sca-reports/dependency-check-report.json 2>/dev/null | wc -l || echo "0")
            
            echo "### Vulnerability Summary" >> consolidated-report/security-report.md
            echo "- 🔴 Critical vulnerabilities: **$CRITICAL**" >> consolidated-report/security-report.md
            echo "- 🟠 High vulnerabilities: **$HIGH**" >> consolidated-report/security-report.md
            echo "- 🟡 Medium vulnerabilities: **$MEDIUM**" >> consolidated-report/security-report.md
            echo "- 🔵 Low vulnerabilities: **$LOW**" >> consolidated-report/security-report.md
          fi
          if [ -f "security-reports/sca-reports/snyk-report.json" ]; then
            echo "- Snyk vulnerability scan available" >> consolidated-report/security-report.md
          fi
        else
          echo "❌ SCA analysis failed or not available" >> consolidated-report/security-report.md
        fi
        echo "" >> consolidated-report/security-report.md
        
        echo "## 🌐 DAST Analysis Results" >> consolidated-report/security-report.md
        if [ -d "security-reports/dast-reports" ]; then
          echo "✅ DAST analysis completed" >> consolidated-report/security-report.md
          if [ -f "security-reports/dast-reports/zap-baseline-report.html" ]; then
            echo "- OWASP ZAP baseline scan available" >> consolidated-report/security-report.md
          fi
          if [ -f "security-reports/dast-reports/zap-full-scan-report.html" ]; then
            echo "- OWASP ZAP full scan available" >> consolidated-report/security-report.md
          fi
          if [ -f "security-reports/dast-reports/nikto-report.txt" ]; then
            echo "- Nikto web server scan available" >> consolidated-report/security-report.md
          fi
        else
          echo "❌ DAST analysis failed or not available" >> consolidated-report/security-report.md
        fi
        
        echo "" >> consolidated-report/security-report.md
        echo "## 📊 Security Metrics Dashboard" >> consolidated-report/security-report.md
        echo "For real-time security metrics and trends, check the security monitoring dashboard." >> consolidated-report/security-report.md
        echo "" >> consolidated-report/security-report.md
        echo "## 📋 Recommendations" >> consolidated-report/security-report.md
        echo "1. Review all critical and high severity vulnerabilities immediately" >> consolidated-report/security-report.md
        echo "2. Update vulnerable dependencies to secure versions" >> consolidated-report/security-report.md
        echo "3. Implement security fixes for SAST findings" >> consolidated-report/security-report.md
        echo "4. Address DAST findings in application configuration" >> consolidated-report/security-report.md
        echo "5. Monitor security trends and establish baseline metrics" >> consolidated-report/security-report.md
        
        echo "" >> consolidated-report/security-report.md
        echo "---" >> consolidated-report/security-report.md
        echo "*This report was generated automatically by the BetAware API security pipeline.*" >> consolidated-report/security-report.md
        echo "*For detailed results, please check the individual report artifacts.*" >> consolidated-report/security-report.md
    
    - name: Upload consolidated report
      uses: actions/upload-artifact@v3
      with:
        name: consolidated-security-report
        path: consolidated-report/
    
    - name: Comment PR with security summary (if PR)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          try {
            const reportPath = 'consolidated-report/security-report.md';
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              
              // Extract just the summary for PR comment
              const lines = report.split('\n');
              let summary = '## 🛡️ Security Pipeline Results\n\n';
              
              // Find security gate status
              const gateIndex = lines.findIndex(line => line.includes('Security Gate Status'));
              if (gateIndex !== -1 && gateIndex + 1 < lines.length) {
                summary += lines[gateIndex + 1] + '\n\n';
              }
              
              // Add vulnerability summary if available
              const vulnIndex = lines.findIndex(line => line.includes('Vulnerability Summary'));
              if (vulnIndex !== -1) {
                summary += '### Vulnerability Summary\n';
                for (let i = vulnIndex + 1; i < lines.length && lines[i].startsWith('- '); i++) {
                  summary += lines[i] + '\n';
                }
              }
              
              summary += '\n📊 [View Full Security Report](../actions/runs/' + context.runId + ')';
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }
          } catch (error) {
            console.log('Could not post PR comment:', error.message);
          }